name: Pubblica su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# una pubblicazione alla volta: quella in corso finisce sempre, le successive in coda si riducono all'ultima
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # 1) prepara e carica il sito
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
  # 2) lo pubblica in un job separato, come consiglia GitHub: il pacchetto caricato e' gia' registrato
  #    (nello stesso job a volte non veniva trovato) e se serve si rilancia solo questo passaggio
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
